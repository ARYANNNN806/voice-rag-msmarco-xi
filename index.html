<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Voice RAG · MSMARCO-XI</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg2: #131722;
    --fg: #e7ecf3;
    --muted: #9aa6b2;
    --accent: #6ee7b7;
    --accent2: #60a5fa;
    --danger: #f87171;
    --warn: #fbbf24;
    --ok: #34d399;
    --border: #1f2937;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, #0b0d12 0%, #0e1118 100%);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .tag { color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    padding: 20px;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .chat {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
  .msg.u { align-self: flex-end; background: var(--accent2); color: #0b1320; }
  .msg.b { align-self: flex-start; background: #1a2030; border: 1px solid #232b3a; }
  .msg.b.refused { border-color: var(--danger); }
  .msg.b .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .msg.b .src { color: var(--muted); font-size: 12px; margin-top: 8px; border-top: 1px dashed #2a3346; padding-top: 6px; }
  .msg.b .src em { color: var(--fg); font-style: normal; }
  .controls {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--border);
    padding: 12px;
    background: #0e1118;
    border-radius: 0 0 12px 12px;
  }
  .controls input[type="text"] {
    flex: 1;
    background: #0b0d12;
    border: 1px solid #232b3a;
    color: var(--fg);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  .controls input[type="text"]:focus { outline: none; border-color: var(--accent2); }
  .btn {
    background: var(--accent2);
    color: #0b1320;
    border: 0;
    padding: 10px 14px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .btn.mic {
    background: #1a2030; color: var(--fg); border: 1px solid #2a3346;
    width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 50%;
  }
  .btn.mic.rec { background: var(--danger); color: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.7); } 50% { box-shadow: 0 0 0 10px rgba(248,113,113,0); } }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .side {
    display: flex; flex-direction: column; gap: 14px;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .b-extractive { background: #0e3b2a; color: var(--accent); }
  .b-generative { background: #11224a; color: var(--accent2); }
  .b-refused { background: #3b1414; color: var(--danger); }
  .b-greeting { background: #2a2245; color: #c4b5fd; }
  .b-no_context { background: #3b2c0e; color: var(--warn); }
  .small { color: var(--muted); font-size: 12px; }
  .lang-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background: #1a2030; color: var(--fg); }
  pre { white-space: pre-wrap; word-wrap: break-word; }
  audio { display: none; }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; }
  .samples button {
    background: #1a2030; color: var(--fg); border: 1px solid #2a3346;
    padding: 5px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .samples button:hover { border-color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Voice RAG · <span style="color:var(--accent2)">MSMARCO-XI</span></h1>
    <div class="tag">Sarvam saarika/bulbul · BM25 + char-ngram FAISS · 14 Indic languages</div>
  </div>
  <div>
    <span id="status-pill" class="lang-pill">loading…</span>
  </div>
</header>

<main>
  <section class="chat">
    <div id="messages" class="messages"></div>
    <div class="controls">
      <button id="mic" class="btn mic" title="Hold to record">🎙</button>
      <input id="text" type="text" placeholder="Type or speak your question in Hindi, English, Tamil…" />
      <button id="send" class="btn">Send</button>
      <audio id="tts"></audio>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <h3>Index</h3>
      <div class="kv"><span class="k">Chunks</span><span class="v" id="n-chunks">–</span></div>
      <div class="kv"><span class="k">Strategies</span><span class="v" id="n-strat">–</span></div>
      <div class="kv"><span class="k">Languages</span><span class="v" id="n-lang">–</span></div>
    </div>
    <div class="card">
      <h3>Latency (live)</h3>
      <div class="kv"><span class="k">Total runs</span><span class="v" id="n-runs">0</span></div>
      <div class="kv"><span class="k">P50</span><span class="v" id="p50">–</span></div>
      <div class="kv"><span class="k">P70</span><span class="v" id="p70">–</span></div>
      <div class="kv"><span class="k">P90</span><span class="v" id="p90">–</span></div>
      <div class="kv"><span class="k">P100 (max)</span><span class="v" id="p100">–</span></div>
      <div class="kv"><span class="k">Budget breaches</span><span class="v" id="breach">0%</span></div>
    </div>
    <div class="card">
      <h3>Try a sample</h3>
      <div class="samples" id="samples"></div>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const messages = $("messages");

function add(text, who, opts = {}) {
  const div = document.createElement("div");
  div.className = "msg " + (who === "u" ? "u" : "b") + (opts.mode === "refused" ? " refused" : "");
  div.innerHTML = opts.html || "";
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function esc(s) {
  return (s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
}

function renderBot(out) {
  const mode = out.answer_mode || "extractive";
  const badge = `<span class="badge b-${esc(mode)}">${esc(mode)}</span>`;
  const meta = `
    <div class="meta">
      ${badge}
      ${out.detected_language ? `<span class="lang-pill">${esc(out.detected_language)}</span>` : ""}
      ${out.stt_confidence ? `<span>STT conf ${esc(out.stt_confidence.toFixed(2))}</span>` : ""}
      ${typeof out.groundedness === "number" ? `<span>groundedness ${out.groundedness.toFixed(2)}</span>` : ""}
      ${out.timings?.total_ms ? `<span>${out.timings.total_ms.toFixed(1)} ms</span>` : ""}
      ${out.timings?.stt_ms ? `<span>(stt ${out.timings.stt_ms.toFixed(0)})</span>` : ""}
    </div>`;
  let srcs = "";
  if (out.sources && out.sources.length) {
    srcs = `<div class="src"><strong>Source</strong>: <em>${esc(out.sources[0].snippet)}</em><br/>` +
           `<span class="small">strategy: ${esc(out.sources[0].strategy)} · lang: ${esc(out.sources[0].target_lang || "–")}</span></div>`;
  }
  const refused = out.refused ? `<div class="src"><strong>Refused</strong>: <em>${esc(out.refused.code)}</em></div>` : "";
  add("", "b", { html: `${esc(out.answer || "(no answer)")}${refused}${srcs}${meta}` });
  refreshStats();
  // If TTS audio returned, play it
  if (out.tts_audio_b64) {
    const audio = $("tts");
    audio.src = "data:audio/wav;base64," + out.tts_audio_b64;
    audio.play().catch(() => {});
  }
}

async function callQuery(payload) {
  const r = await fetch("/query", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    add(`Error ${r.status}: ${await r.text()}`, "b");
    return;
  }
  const out = await r.json();
  if (out.transcript) add(`<span class="small">transcribed:</span> ${esc(out.transcript)}`, "b");
  renderBot(out);
}

$("send").onclick = () => {
  const q = $("text").value.trim();
  if (!q) return;
  add(esc(q), "u");
  $("text").value = "";
  callQuery({ query: q });
};

$("text").onkeydown = (e) => { if (e.key === "Enter") $("send").click(); };

// ---- mic ----
let mediaRecorder = null;
let chunks = [];
let recording = false;

$("mic").onmousedown = startRec;
$("mic").onmouseup = stopRec;
$("mic").onmouseleave = () => { if (recording) stopRec(); };
$("mic").ontouchstart = (e) => { e.preventDefault(); startRec(); };
$("mic").ontouchend = (e) => { e.preventDefault(); stopRec(); };

async function startRec() {
  if (recording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
    chunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      stream.getTracks().forEach(t => t.stop());
      const b64 = await blobToB64(blob);
      add("🎙 (voice query)", "u");
      const fd = new FormData();
      fd.append("audio", blob, "query.webm");
      fd.append("audio_content_type", "audio/webm");
      fd.append("want_tts", "true");
      const r = await fetch("/voice", { method: "POST", body: fd });
      if (!r.ok) { add(`Error ${r.status}: ${await r.text()}`, "b"); return; }
      const out = await r.json();
      if (out.transcript) add(`<span class="small">transcribed:</span> ${esc(out.transcript)}`, "b");
      renderBot(out);
    };
    mediaRecorder.start();
    recording = true;
    $("mic").classList.add("rec");
  } catch (e) {
    add(`Mic error: ${e.message}`, "b");
  }
}

function stopRec() {
  if (!recording) return;
  recording = false;
  $("mic").classList.remove("rec");
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
}

function blobToB64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onloadend = () => res(fr.result.split(",")[1]);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

// ---- health + stats ----
async function refreshHealth() {
  const r = await fetch("/healthz");
  const d = await r.json();
  $("status-pill").textContent = d.sarvam_configured ? "online · Sarvam ✓" : "online (no Sarvam key)";
  $("n-chunks").textContent = d.index?.n_chunks ?? "–";
  $("n-strat").textContent = (d.index?.strategies || []).join(", ") || "–";
  $("n-lang").textContent = (d.index?.langs || []).length + " langs";
}

async function refreshStats() {
  const r = await fetch("/stats");
  const d = await r.json();
  $("n-runs").textContent = d.n || 0;
  $("p50").textContent = d.p50_ms ? d.p50_ms.toFixed(1) + " ms" : "–";
  $("p70").textContent = d.p70_ms ? d.p70_ms.toFixed(1) + " ms" : "–";
  $("p90").textContent = d.p90_ms ? d.p90_ms.toFixed(1) + " ms" : "–";
  $("p100").textContent = d.p100_ms ? d.p100_ms.toFixed(1) + " ms" : "–";
  $("breach").textContent = (d.budget_breach_pct ?? 0) + "%";
}

const SAMPLES = {
  hi: [
    "कॉर्पोरेशन क्या है?",
    "भारत की राजधानी क्या है?",
  ],
  en: [
    "what is a corporation?",
    "how does the heart work?",
  ],
  mr: [
    "कॉर्पोरेशन म्हणजे काय?",
  ],
  ta: [
    "இதயம் எப்படி வேலை செய்கிறது?",
  ],
};

function buildSamples() {
  const root = $("samples");
  for (const [lang, qs] of Object.entries(SAMPLES)) {
    for (const q of qs) {
      const b = document.createElement("button");
      b.textContent = `[${lang}] ${q}`;
      b.onclick = () => {
        $("text").value = q;
        $("send").click();
      };
      root.appendChild(b);
    }
  }
}

buildSamples();
refreshHealth();
refreshStats();
setInterval(refreshStats, 5000);
</script>
</body>
</html>
